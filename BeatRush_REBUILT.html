<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BeatRush — Rhythm Game</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a12;color:#fff;font-family:Arial,sans-serif}
button{font:inherit}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
#lobby{overflow:auto;background:radial-gradient(circle at 50% 0,#29386d,#0d1120 52%,#07090f)}
.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#070a12e8;border-bottom:1px solid #ffffff14;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.logo{font-size:24px;font-weight:900;letter-spacing:2px}.logo b{color:#65e8ff}
.profile{display:flex;align-items:center;gap:9px;color:#aebbd5}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#65e8ff,#9367ff);font-weight:900}
.hero{max-width:1050px;margin:auto;padding:35px 20px 15px}.hero h1{font-size:40px;margin:0 0 7px}.hero p{color:#a2aec7;margin:0}
.levels{max-width:1050px;margin:auto;padding:15px 20px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}
.card{background:#12182a;border:1px solid #ffffff12;border-radius:18px;padding:16px;cursor:pointer;box-shadow:0 15px 40px #0005;transition:.15s}.card:hover{transform:translateY(-3px);border-color:#65e8ff55}
.art{height:105px;border-radius:13px;margin-bottom:14px;background:linear-gradient(120deg,#243c78,#7a3da0);position:relative;overflow:hidden}.art:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-40px;top:-70px;background:#ffffff14}
.art.b{background:linear-gradient(120deg,#124d59,#138fa1)}.art.c{background:linear-gradient(120deg,#5a292b,#bd6135)}.art.d{background:linear-gradient(120deg,#292450,#3f69c0)}
.card h2{margin:0 0 5px}.meta{font-size:13px;color:#8e9db9}.difficulty{display:inline-block;margin-top:10px;padding:6px 9px;border-radius:8px;background:#ffffff0c;color:#65e8ff;font-size:12px}
.play{float:right;border:0;border-radius:9px;padding:9px 13px;background:#65e8ff;color:#061017;font-weight:900}

#game{background:#070a12;touch-action:none}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{position:absolute;left:0;right:0;top:0;height:76px;display:flex;gap:9px;align-items:center;padding:10px 13px;pointer-events:none;background:linear-gradient(#060912ed,transparent)}
.stat{min-width:78px;text-align:center;background:#10172aab;border:1px solid #ffffff12;border-radius:10px;padding:7px 9px}.stat small{display:block;color:#8492ad;font-size:10px}.stat b{font-size:17px}
.quit{margin-left:auto;pointer-events:auto;border:0;border-radius:9px;padding:9px 12px;background:#ffffff10;color:#fff}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);opacity:0;transition:.15s;background:#11182aee;border:1px solid #ffffff14;padding:8px 13px;border-radius:10px;font-weight:800;pointer-events:none}.show{opacity:1!important}

#result{place-items:center;background:radial-gradient(circle at 50% 20%,#29376c,#070a11 70%)}
.resultbox{width:min(500px,92vw);padding:30px;border-radius:23px;text-align:center;background:#12182aee;border:1px solid #ffffff15;box-shadow:0 25px 70px #0008}
.grade{font-size:88px;font-weight:900;color:#65e8ff}.finalscore{font-size:34px;font-weight:900}.finalacc{color:#aebbd2;margin:7px 0 18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rs{background:#ffffff08;border-radius:10px;padding:11px}.rs b{display:block;font-size:20px}.rs small{color:#8593ad}
.action{margin:16px 3px 0;border:0;border-radius:10px;padding:11px 17px;background:#65e8ff;color:#061017;font-weight:900}.action.alt{background:#ffffff10;color:#fff}
</style>
</head>
<body>
<section id="lobby" class="screen active">
 <div class="top"><div class="logo">BEAT<b>RUSH</b></div><div class="profile">Player <span class="avatar">P</span></div></div>
 <div class="hero"><h1>Official Levels</h1><p>Tap, hold, slide, dan multi-hit. Jangan kehilangan combo.</p></div>
 <div id="levels" class="levels"></div>
</section>

<section id="game" class="screen">
 <canvas id="gameCanvas"></canvas>
 <div class="hud">
  <div class="stat"><small>SCORE</small><b id="score">0</b></div>
  <div class="stat"><small>ACCURACY</small><b id="acc">100%</b></div>
  <div class="stat"><small>COMBO</small><b id="combo">0x</b></div>
  <button id="quit" class="quit">✕ Lobby</button>
 </div>
 <div id="toast">Follow the arrow →</div>
</section>

<section id="result" class="screen">
 <div class="resultbox">
  <div id="grade" class="grade">S</div>
  <div id="finalScore" class="finalscore">0</div>
  <div id="finalAcc" class="finalacc">100%</div>
  <div class="grid">
   <div class="rs"><b id="pCount">0</b><small>Perfect</small></div>
   <div class="rs"><b id="gCount">0</b><small>Great</small></div>
   <div class="rs"><b id="oCount">0</b><small>OK / Bad</small></div>
  </div>
  <button id="retry" class="action">Retry</button><button id="back" class="action alt">Lobby</button>
 </div>
</section>

<script>
"use strict";

const LEVELS=[
 {name:"Neon Pulse",artist:"BeatRush",diff:"Easy",stars:2,art:"",speed:950,holdChance:.10,multiChance:.08,slideChance:.08,maxNotes:2},
 {name:"Crystal Drive",artist:"Nova",diff:"Normal",stars:4,art:"b",speed:720,holdChance:.16,multiChance:.14,slideChance:.14,maxNotes:3},
 {name:"Cyber Storm",artist:"Vektor",diff:"Hard",stars:6,art:"c",speed:540,holdChance:.22,multiChance:.20,slideChance:.22,maxNotes:4},
 {name:"Final Horizon",artist:"Astra",diff:"Extreme",stars:9,art:"d",speed:560,holdChance:.22,multiChance:.18,slideChance:.22,maxNotes:4}
];

const $=id=>document.getElementById(id);
const lobby=$("lobby"),game=$("game"),result=$("result"),canvas=$("gameCanvas"),ctx=canvas.getContext("2d");

let W=0,H=0,DPR=1;
let currentLevel=0,playing=false,lastTime=0,time=0,nextSpawn=0;
let notes=[],effects=[];
let score=0,combo=0,maxCombo=0,accuracy=100,perfects=0,greats=0,oks=0,bads=0;
let pointer={id:null,down:false,x:0,y:0};
let holdState=null,slideState=null;

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

LEVELS.forEach((l,i)=>{
 const card=document.createElement("div");card.className="card";
 card.innerHTML=`<div class="art ${l.art}"></div><button class="play">PLAY</button><h2>${l.name}</h2><div class="meta">${l.artist} • Official Level</div><span class="difficulty">${l.diff} ${"★".repeat(l.stars)}</span>`;
 card.onclick=()=>start(i);$("levels").appendChild(card);
});

function start(level){
 currentLevel=level; lobby.classList.remove("active");result.classList.remove("active");game.classList.add("active");
 reset();playing=true;lastTime=performance.now();requestAnimationFrame(loop);
}
function reset(){
 notes=[];effects=[];time=0;nextSpawn=450;score=combo=maxCombo=0;accuracy=100;perfects=greats=oks=bads=0;
 pointer={id:null,down:false,x:0,y:0};holdState=null;slideState=null;updateHUD();
}
function updateHUD(){
 $("score").textContent=Math.floor(score).toLocaleString();
 $("combo").textContent=combo+"x";$("acc").textContent=accuracy.toFixed(1)+"%";
}
function loop(now){
 if(!playing)return;
 const dt=Math.min(50,now-lastTime);lastTime=now;time+=dt;
 const L=LEVELS[currentLevel];
 if(time>=nextSpawn && time<28000+currentLevel*4000){
   spawnNote();
   if(currentLevel===2 && Math.random()<0.12)spawnNote();
   if(currentLevel===3 && Math.random()<0.07)spawnNote();
   nextSpawn=time+L.speed*(0.90+Math.random()*0.35);
 }
 update(dt);draw();
 if(time>=30000+currentLevel*4000 && notes.every(n=>n.dead)){finish();return}
 requestAnimationFrame(loop);
}

function randomPosition(){
 for(let tries=0;tries<50;tries++){
  const x=65+Math.random()*(W-130),y=125+Math.random()*Math.max(80,H-230);
  if(notes.every(n=>n.dead||Math.hypot(n.x-x,n.y-y)>125))return{x,y};
 }
 return{x:W/2,y:H/2+Math.random()*100};
}

function spawnNote(){
 const L=LEVELS[currentLevel];
 const r=Math.random();
 let type;
 if(r<L.slideChance) type="slide";
 else if(r<L.slideChance+L.holdChance) type="hold";
 else if(r<L.slideChance+L.holdChance+L.multiChance) type="multi";
 else type="tap";

 const p=randomPosition();
 const n={id:Math.random(),type,x:p.x,y:p.y,r:31,spawn:time,dead:false,judged:false,hit:false,fade:0,progress:0,presses:0,phase:Math.random()*6.28};
 if(type==="hold"){n.holdStart=0;n.duration=500}
 if(type==="multi"){n.count=3}
 if(type==="slide"){
   const end=randomPositionFar(p.x,p.y);
   n.path=makePath(p.x,p.y,end.x,end.y);
   n.pathIndex=0;
 }
 notes.push(n);
}
function randomPositionFar(x,y){
 for(let i=0;i<40;i++){
  const p={x:65+Math.random()*(W-130),y:125+Math.random()*Math.max(80,H-230)};
  if(Math.hypot(p.x-x,p.y-y)>180)return p;
 }
 return{x:Math.max(65,Math.min(W-65,x+180)),y:Math.max(125,Math.min(H-110,y+80))};
}
function makePath(x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,px=-dy/len,py=dx/len;
 const bend=(Math.random()-.5)*Math.min(130,len*.45),path=[];
 for(let i=0;i<=30;i++){
  const t=i/30,c=Math.sin(Math.PI*t)*bend;
  path.push({x:x1+dx*t+px*c,y:y1+dy*t+py*c});
 }
 return path;
}

function update(dt){
 for(const n of notes){
  if(n.dead){n.fade+=dt/700;continue}
  const age=time-n.spawn;
  if(n.type==="hold"&&n.holding){
   n.progress=Math.min(1,(time-n.holdStart)/500);
   if(n.progress>=1)complete(n,"perfect");
  }
  if(age>=5000 && !n.dead) complete(n,"bad");
 }
 effects.forEach(e=>e.life-=dt);effects=effects.filter(e=>e.life>0);
 updateHUD();
}

function classify(age){
 // Much tighter timing windows: the later you react, the worse the judgment.
 if(age<=700)return"perfect";
 if(age<=1400)return"great";
 if(age<=2200)return"ok";
 return"bad";
}

function applyAccuracy(kind){
 if(kind==="perfect")accuracy=Math.min(100,accuracy+1.5+Math.random()*1.5);
 else if(kind==="great")accuracy=Math.min(100,accuracy+0.4+Math.random()*0.6);
 else if(kind==="ok")accuracy=Math.max(0,accuracy-1.5-Math.random()*1.0);
 else accuracy=Math.max(0,accuracy-4-Math.random()*3);
}

function complete(n,kind){
 if(n.dead)return;
 applyAccuracy(kind);
 if(kind==="perfect"){score+=100+Math.min(combo,50);combo++;perfects++}
 else if(kind==="great"){score+=65+Math.min(combo,35);combo++;greats++}
 else if(kind==="ok"){score+=25;combo=0;oks++}
 else{score+=0;combo=0;bads++}
 maxCombo=Math.max(maxCombo,combo);
 n.dead=true;n.fade=0;n.holding=false;n.judged=true;
 effects.push({x:n.x,y:n.y,text:kind.toUpperCase(),life:650,kind});
}

function pointerPos(e){
 const r=canvas.getBoundingClientRect();
 return{x:e.clientX-r.left,y:e.clientY-r.top};
}

function nearestNote(x,y){
 let best=null,dist=Infinity;
 for(const n of notes){
  if(n.dead)continue;
  let tx=n.x,ty=n.y;
  if(n.type==="slide"&&!n.hit){tx=n.path[0].x;ty=n.path[0].y}
  const d=Math.hypot(x-tx,y-ty);
  if(d<dist&&d<=105){dist=d;best=n}
 }
 return best;
}

function pathNearest(path,x,y,start){
 let best=Infinity,index=start;
 for(let i=start;i<path.length;i++){
  const d=Math.hypot(x-path[i].x,y-path[i].y);
  if(d<best){best=d;index=i}
 }
 return{d:best,index};
}

canvas.addEventListener("pointerdown",e=>{
 if(!playing)return;e.preventDefault();
 const p=pointerPos(e);pointer.id=e.pointerId;pointer.down=true;pointer.x=p.x;pointer.y=p.y;
 try{canvas.setPointerCapture(e.pointerId)}catch(_){}
 const n=nearestNote(p.x,p.y);if(!n)return;
 const age=time-n.spawn;if(age>5000)return;

 if(n.type==="tap"){
  complete(n,classify(age));
 }else if(n.type==="multi"){
  n.hit=true;n.presses++;
  applyAccuracy(classify(age));
  const k=classify(age);
  if(k==="perfect"){score+=300;perfects++}else if(k==="great"){score+=180;greats++}else if(k==="ok"){score+=80;oks++}else{score+=20;bads++}
  combo=k==="bad"?0:combo+1;maxCombo=Math.max(maxCombo,combo);
  effects.push({x:n.x,y:n.y,text:k.toUpperCase()+" "+n.presses+"/3",life:450,kind:k});
  if(n.presses>=3){n.dead=true;n.fade=0}
 }else if(n.type==="hold"){
  n.hit=true;n.holding=true;n.holdStart=time;holdState=n;
 }else if(n.type==="slide"){
  n.hit=true;n.holding=true;n.pathIndex=0;slideState=n;
 }
},{passive:false});

canvas.addEventListener("pointermove",e=>{
 if(!playing||e.pointerId!==pointer.id)return;e.preventDefault();
 const p=pointerPos(e);pointer.x=p.x;pointer.y=p.y;
 if(slideState&&!slideState.dead){
  const hit=pathNearest(slideState.path,p.x,p.y,slideState.pathIndex);
  if(hit.d<=95){
   slideState.pathIndex=hit.index;
   if(hit.index>=slideState.path.length-1){
    complete(slideState,classify(time-slideState.spawn));slideState=null;
   }
  }
 }
},{passive:false});

canvas.addEventListener("pointerup",e=>{
 if(e.pointerId!==pointer.id)return;e.preventDefault();
 if(holdState&&!holdState.dead){
  // If the player releases before 0.5 sec, it fails but remains playable.
  if(time-holdState.holdStart>=500){
    complete(holdState,classify(time-holdState.spawn));
  }else if(!holdState.dead){
    accuracy=Math.max(0,accuracy-3-Math.random()*2);
    combo=0;bads++;
    effects.push({x:holdState.x,y:holdState.y,text:"RELEASED",life:650,kind:"bad"});
    holdState.dead=true;
    holdState.fade=0;
  }
  holdState.holding=false;
 }
 pointer.id=null;pointer.down=false;holdState=null;slideState=null;
},{passive:false});

canvas.addEventListener("pointercancel",e=>{
 if(e.pointerId===pointer.id){
  if(holdState&&!holdState.dead)holdState.holding=false;
  pointer.id=null;pointer.down=false;holdState=null;slideState=null;
 }
});

function draw(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H)*.75);
 bg.addColorStop(0,"#19254a");bg.addColorStop(1,"#070a12");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="#ffffff08";
 for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,75);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=100;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

 for(const n of notes)drawNote(n);
 for(const e of effects){
  ctx.globalAlpha=Math.pow(Math.max(0,e.life/650),0.8);ctx.textAlign="center";ctx.font="900 21px Arial";
  ctx.fillStyle=e.kind==="perfect"?"#65e8ff":e.kind==="great"?"#8dff9b":e.kind==="ok"?"#ffca65":"#ff667e";
  ctx.fillText(e.text,e.x,e.y-e.life*.025);ctx.globalAlpha=1;
 }
}

function drawNote(n){
 let alpha=n.dead?Math.max(0,1-n.fade):1;
 if(alpha<=0)return;
 ctx.globalAlpha=alpha;
 const pulse=1+Math.sin(time/90+n.phase)*.045;

 if(n.type==="slide"){
  ctx.strokeStyle="#b87cff66";ctx.lineWidth=18;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(n.path[0].x,n.path[0].y);
  for(let i=1;i<n.path.length;i++)ctx.lineTo(n.path[i].x,n.path[i].y);ctx.stroke();
  for(let i=2;i<n.path.length-2;i+=3){
   const a=n.path[i],b=n.path[i+1];
   const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
   const ux=dx/len,uy=dy/len,px=-uy,py=ux;
   // Arrowhead is drawn at the exact path point and rotated to the path tangent.
   ctx.save();
   ctx.translate(a.x,a.y);
   ctx.rotate(Math.atan2(dy,dx));
   ctx.fillStyle="#f0dcff";
   ctx.beginPath();
   ctx.moveTo(12,0);
   ctx.lineTo(-8,-9);
   ctx.lineTo(-3,0);
   ctx.lineTo(-8,9);
   ctx.closePath();
   ctx.fill();
   ctx.restore();
  }
 }
 if(n.type==="hold"){
  ctx.strokeStyle="#65e8ff55";ctx.lineWidth=20;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(n.x,n.y+65);ctx.stroke();
 }

 const color=n.type==="tap"?"#ffffff":n.type==="hold"?"#65e8ff":n.type==="multi"?"#ffca65":"#bd7cff";
 ctx.shadowBlur=20;ctx.shadowColor=color;ctx.fillStyle=color;
 ctx.beginPath();ctx.arc(n.x,n.y,n.r*pulse,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle="#07101a";ctx.textAlign="center";ctx.font="900 22px Arial";
 ctx.fillText(n.type==="tap"?"●":n.type==="hold"?"▣":n.type==="multi"?"×3":"↯",n.x,n.y+7);
 if(n.type==="multi"){ctx.font="900 10px Arial";ctx.fillText(`${n.presses}/3`,n.x,n.y+45)}
 if(n.type==="hold"){
  ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.arc(n.x,n.y,n.r+8,-Math.PI/2,-Math.PI/2+Math.PI*2*n.progress);ctx.stroke();
 }
 if(n.type==="slide" && n.hit && n.path){
   const q=n.path[Math.min(n.pathIndex,n.path.length-1)];
   ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(q.x,q.y,7,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
}

function finish(){
 playing=false;game.classList.remove("active");result.classList.add("active");
 const g=accuracy>=98?"S":accuracy>=94?"A":accuracy>=88?"B":accuracy>=78?"C":"D";
 $("grade").textContent=g;$("finalScore").textContent=Math.floor(score).toLocaleString();$("finalAcc").textContent=accuracy.toFixed(1)+"%";
 $("pCount").textContent=perfects;$("gCount").textContent=greats;$("oCount").textContent=oks+bads;
}

$("quit").onclick=()=>{playing=false;game.classList.remove("active");lobby.classList.add("active")};
$("retry").onclick=()=>start(currentLevel);
$("back").onclick=()=>{result.classList.remove("active");lobby.classList.add("active")};
</script>
</body>
</html>
